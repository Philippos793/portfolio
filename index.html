<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Philippos Tsikouras — Full-Stack Developer working with React, Java and Spring Boot. Projects, skills and contact information."
    />
    <title>Philippos Tsikouras | Full-Stack Developer</title>

    <!-- Preview when the link is shared (LinkedIn, Facebook, Viber, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Philippos Tsikouras | Full-Stack Developer" />
    <meta
      property="og:description"
      content="Full-Stack Developer working with React, Java and Spring Boot. Projects, skills and contact information."
    />
    <!-- Crawlers need absolute URLs -->
    <meta property="og:url" content="https://philippos-tsikouras.vercel.app/" />
    <meta property="og:image" content="https://philippos-tsikouras.vercel.app/og-image.png" />
    <meta property="og:image:alt" content="Philippos Tsikouras, Full-Stack Developer" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Runs before React, so the page does not flash in the wrong theme
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        // Default: dark. Light only if the visitor has chosen it
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'dark'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
